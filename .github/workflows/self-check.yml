# Checks this repo's own workflows and scripts so a broken change isn't
# rolled out to every project that uses them.
name: Self-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  shellcheck:
    name: Lint scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: shellcheck scripts/*.sh

  setup-script:
    name: Test setup script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The script pins to the latest release tag, so it needs the tags.
          fetch-depth: 0
      - name: Add CI to a sample Node project in a subfolder
        run: |
          repo=$(mktemp -d)
          git init -q "$repo"
          mkdir "$repo/app"
          echo '{"scripts":{"lint":"true","test:unit":"true"}}' > "$repo/app/package.json"
          scripts/add-to-repo.sh "$repo" --dir app
          grep -q 'working-directory: app' "$repo/.github/workflows/ci.yml"
          grep -q 'directory: "/app"' "$repo/.github/dependabot.yml"
          grep -Eq 'node-ci\.yml@[0-9a-f]{40} # v[0-9]+\.[0-9]+\.[0-9]+$' "$repo/.github/workflows/ci.yml"
          if grep -rn '__[A-Z_]*__' "$repo/.github"; then echo "Unfilled template placeholder"; exit 1; fi
      - name: Add CI to a sample Python project
        run: |
          repo=$(mktemp -d)
          git init -q "$repo"
          touch "$repo/requirements.txt" "$repo/main.py"
          git -C "$repo" add .
          scripts/add-to-repo.sh "$repo"
          grep -q "codeql-languages: '\[\"python\", \"actions\"\]'" "$repo/.github/workflows/ci.yml"
          grep -q 'package-ecosystem: pip' "$repo/.github/dependabot.yml"
      - name: Add CI to a Python project without a dependency file
        run: |
          repo=$(mktemp -d)
          git init -q "$repo"
          touch "$repo/game.py"
          git -C "$repo" add .
          scripts/add-to-repo.sh "$repo"
          if grep -q 'package-ecosystem: pip' "$repo/.github/dependabot.yml"; then echo "Unexpected pip entry"; exit 1; fi
          grep -q 'package-ecosystem: github-actions' "$repo/.github/dependabot.yml"
      - name: Add CI to a sample MakeCode project on master
        run: |
          repo=$(mktemp -d)
          git init -q -b master "$repo"
          # MakeCode projects also ship a Gemfile; it must not be detected as Ruby.
          echo '{"supportedTargets":["microbit"]}' > "$repo/pxt.json"
          touch "$repo/main.ts" "$repo/Gemfile"
          git -C "$repo" add .
          scripts/add-to-repo.sh "$repo"
          grep -q 'makecode-ci\.yml@' "$repo/.github/workflows/ci.yml"
          grep -q 'branches: \[master\]' "$repo/.github/workflows/ci.yml"
          grep -q "codeql-languages: '\[\"javascript-typescript\", \"actions\"\]'" "$repo/.github/workflows/ci.yml"
          if grep -rn '__[A-Z_]*__' "$repo/.github"; then echo "Unfilled template placeholder"; exit 1; fi
