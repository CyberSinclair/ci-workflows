# Copied from CyberSinclair/ci-workflows (templates/ci-security-only.yml).
# Security scans for projects that aren't Node.js (e.g. Python, Ruby).
# Add the project's own test job below if it has tests.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly run to catch newly published vulnerabilities in unchanged code.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security
    uses: CyberSinclair/ci-workflows/.github/workflows/security.yml@v1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      codeql-languages: '__CODEQL_LANGUAGES__'
