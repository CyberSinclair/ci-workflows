# Copied from CyberSinclair/ci-workflows (templates/ci-makecode.yml).
# The real work happens in the shared reusable workflows; this file only
# decides when they run and passes project settings.
name: CI

on:
  pull_request:
  push:
    branches: [__DEFAULT_BRANCH__]
  schedule:
    # Weekly run to catch newly published vulnerabilities in unchanged code.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: MakeCode
    uses: CyberSinclair/ci-workflows/.github/workflows/makecode-ci.yml@__CI_WORKFLOWS_SHA__ # __CI_WORKFLOWS_VERSION__
    with:
      working-directory: __WORKING_DIRECTORY__

  security:
    name: Security
    uses: CyberSinclair/ci-workflows/.github/workflows/security.yml@__CI_WORKFLOWS_SHA__ # __CI_WORKFLOWS_VERSION__
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      codeql-languages: '__CODEQL_LANGUAGES__'
